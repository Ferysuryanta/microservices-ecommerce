server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:local_dev_password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  lifecycle:
    timeout-per-shutdown-phase: 20s

security:
  jwt:
    issuer: auth-service
    access-token-ttl: 15m
    key-id: auth-key-2026-01
    private-key-location: file:./secrets/jwt-private.pem
    public-key-location: file:./secrets/jwt-public.pem

  refresh-token-ttl: 2592000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: Auth Service
    description: Authentication and authorization microservice
    version: 0.1.0

logging:
  level:
    org.springframework.security: INFO
    root: INFO