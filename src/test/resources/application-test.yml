spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_test_db
    username: auth_user
    password: local_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

security:
  jwt:
    issuer: auth-service
    access-token-ttl: 15m
    key-id: auth-key-2026-01
    private-key-location: file:./secrets/jwt-private.pem
    public-key-location: file:./secrets/jwt-public.pem

  refresh-token-ttl: 300